name: Monitoreo Aduana

on:
  schedule:
    # Corre cada 30 min desde las 12:00 UTC hasta las 00:30 UTC (08:00 a 20:30 hora de Bolivia)
    - cron: '0,30 12-23,0 * * *'
  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Instalar navegador Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GSPREAD_CREDENTIALS_JSON: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
        run: python bot_aduana.py
