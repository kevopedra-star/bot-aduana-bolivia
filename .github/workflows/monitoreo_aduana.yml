name: Monitoreo Aduana

on:
  schedule:
    # 1. LUNES A VIERNES: Cada media hora de 08:05 a 19:35 Bolivia (12:05 a 23:35 UTC)
    - cron: '5,35 12-23 * * 1-5'

    # 1b. LUNES A VIERNES: Cierre a las 20:05 y 20:35 Bolivia (00:05 y 00:35 UTC)
    - cron: '5,35 0 * * 2-6'

    # 2. MADRUGADA: Solo 2 veces (01:05 AM y 04:35 AM Bolivia -> 05:05 y 08:35 UTC)
    - cron: '5 5 * * *'
    - cron: '35 8 * * *'

    # 3. SÁBADOS Y DOMINGOS: Solo 2 veces (12:05 PM y 16:05 PM Bolivia -> 16:05 y 20:05 UTC)
    - cron: '5 16,20 * * 0,6'

  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Instalar navegador Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GSPREAD_CREDENTIALS_JSON: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
        run: python bot_aduana.py
