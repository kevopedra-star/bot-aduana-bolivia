name: Monitoreo Aduana

on:
  schedule:
    # Lunes a Viernes: cada 30 min de 08:00 a 20:30 Bolivia (12:00 a 00:30 UTC)
    - cron: '0,30 12-23 * * 1-5'
    - cron: '0,30 0 * * 1-5'

    # Sábados: 12:00 y 16:00 Bolivia (16:00 y 20:00 UTC)
    - cron: '0 16,20 * * 6'

    # Madrugadas: 01:00 AM Bolivia (05:00 UTC) todos los días
    - cron: '0 5 * * *'

    # Madrugadas: 04:30 AM Bolivia (08:30 UTC) todos los días
    - cron: '30 8 * * *'

  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Instalar navegador Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GSPREAD_CREDENTIALS_JSON: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
        run: python bot_aduana.py
